version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/fixtures/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      pre-commit:
        patterns:
          - "*"

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        shell: bash
        run: node --test "tests/**/*.test.mjs"
      - name: Run hook timing test (AK-5)
        shell: bash
        env:
          BUILDORDER_TIMING: '1'
        run: node --test --test-concurrency=1 tests/hooks/timing.test.mjs

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate . --strict
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate plugins/buildorder --strict

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # AK-2, workflow part: the files `standard` writes for the fake stack with every CD variant of
      # docker-cicd and for the django module (deploy targets container and none).
      - name: Generate the standard's repo files
        run: node tests/helpers/standard-sample.mjs "$RUNNER_TEMP/standard"
      # One run covers the repo's own workflows and the generated ones. No SARIF upload
      # (advanced-security: false): the job keeps plain, failing output and needs no security-events
      # permission. The action's shell word-splits and globs the inputs.
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: regular
          advanced-security: false
          inputs: .github/workflows ${{ runner.temp }}/standard/*
      # Syntax and context check that zizmor does not do: the official release archive, pinned by version and hash.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -Fx "${ACTIONLINT_SHA256}  ${archive}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Check the generated workflows (actionlint)
        run: |
          set -Eeuo pipefail
          for sample in "$RUNNER_TEMP"/standard/*/; do
            dir="$RUNNER_TEMP/actionlint/$(basename "$sample")"
            mkdir -p "$dir"
            cp -R "$sample." "$dir/"
            # actionlint 1.7.12 predates the `$/` self-repository syntax, so it checks the same calls in the `./` form.
            sed -i 's#uses: \$/#uses: ./#' "$dir"/.github/workflows/*.yml
            git -C "$dir" init -q
            (cd "$dir" && "$RUNNER_TEMP/actionlint-bin/actionlint")
          done

  # AK-2 for django: `standard --starter` writes the starter and its pipeline into an empty repo, then the
  # core steps of that pipeline run on it. Linux only, for the PostgreSQL service container (K3).
  # The commands, image and Python version are those of the module's ci.yml (tests/lib/stack-django.test.mjs).
  django-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # Throwaway password of the CI service container, not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Write the starter and its pipeline into an empty repo
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/django app"
          git init -q -b main "$dir"
          git -C "$dir" config user.name ci
          git -C "$dir" config user.email ci
          node plugins/buildorder/scripts/buildorder.mjs standard "$dir" --stack django --deploy container --starter --apply
          git -C "$dir" log --oneline --stat
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/django app
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        working-directory: ${{ runner.temp }}/django app
        run: |
          ruff check .
          ruff format --check .
      - name: Generate a throwaway SECRET_KEY
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: Test with coverage
        working-directory: ${{ runner.temp }}/django app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: pytest --cov --cov-report=term-missing
      - name: Build checks
        working-directory: ${{ runner.temp }}/django app
        env:
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Audit dependencies
        working-directory: ${{ runner.temp }}/django app
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt
      - name: Build the image
        working-directory: ${{ runner.temp }}/django app
        run: docker build --tag django-fixture .
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: django-fixture
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # AK-2 for python: `standard --starter` writes the library starter and its pipeline into an empty repo, then the
  # core steps of that pipeline run on it. A second repo with an entry point is a service: it gets the Dockerfile,
  # which is built and scanned. The commands and Python version are those of the module's ci.yml
  # (tests/lib/stack-python.test.mjs).
  python-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Write the starter and its pipeline into an empty repo
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/python app"
          git init -q -b main "$dir"
          git -C "$dir" config user.name ci
          git -C "$dir" config user.email ci
          node plugins/buildorder/scripts/buildorder.mjs standard "$dir" --stack python --deploy none --starter --apply
          git -C "$dir" log --oneline --stat
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/python app
        run: python -m pip install --requirement requirements-dev.txt --editable .
      - name: Lint
        working-directory: ${{ runner.temp }}/python app
        run: |
          ruff check .
          ruff format --check .
      - name: Test with coverage
        working-directory: ${{ runner.temp }}/python app
        run: pytest --cov --cov-report=term-missing
      - name: Build the wheel and the sdist
        working-directory: ${{ runner.temp }}/python app
        run: python -m build
      - name: Audit dependencies
        working-directory: ${{ runner.temp }}/python app
        run: |
          pip-audit --requirement requirements-dev.txt
          pip-audit .
      - name: Turn the starter into a service (adds an entry point) and plan the image
        run: |
          set -Eeuo pipefail
          svc="$RUNNER_TEMP/python service"
          cp -r "$RUNNER_TEMP/python app" "$svc"
          printf '\n[project.scripts]\nexample-package = "example_package:greet"\n' >> "$svc/pyproject.toml"
          node plugins/buildorder/scripts/buildorder.mjs standard "$svc" --stack python --deploy container --apply
          test -f "$svc/Dockerfile"
      - name: Build the image
        working-directory: ${{ runner.temp }}/python service
        run: docker build --tag python-fixture .
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: python-fixture
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Personal-account repo: no GITLEAKS_LICENSE needed (only organization-owned repos need one).
      # Comments are off, so read access to pull requests is enough to list their commits.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Without this the action falls back to gitleaks 8.24.3. Matches pre-commit and the generated pipeline.
          # The action downloads the binary without checksum verification.
          GITLEAKS_VERSION: "8.30.1"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  ci-ok:
    if: always()
    needs: [test, validate, pre-commit, zizmor, django-fixture, python-fixture, gitleaks, codeql]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "At least one job did not succeed."
              exit 1
            fi
          done

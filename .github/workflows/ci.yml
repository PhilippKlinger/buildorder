name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        shell: bash
        run: node --test "tests/**/*.test.mjs"
      - name: Run hook timing test (AK-5)
        shell: bash
        env:
          BUILDORDER_TIMING: '1'
        run: node --test --test-concurrency=1 tests/hooks/timing.test.mjs

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate . --strict
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate plugins/buildorder --strict

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --persona regular .github/workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # AK-2, workflow part: the files `standard` writes for the fake stack with every CD variant of
      # docker-cicd and for the django module (deploy targets container and none).
      - name: Generate the standard's repo files
        run: node tests/helpers/standard-sample.mjs "$RUNNER_TEMP/standard"
      - name: Audit the generated workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --persona regular "$RUNNER_TEMP"/standard/*
      # Syntax and context check that zizmor does not do: the official release archive, pinned by version and hash.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -Fx "${ACTIONLINT_SHA256}  ${archive}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Check the generated workflows (actionlint)
        run: |
          set -Eeuo pipefail
          for sample in "$RUNNER_TEMP"/standard/*/; do
            dir="$RUNNER_TEMP/actionlint/$(basename "$sample")"
            mkdir -p "$dir"
            cp -R "$sample." "$dir/"
            # actionlint 1.7.12 predates the `$/` self-repository syntax, so it checks the same calls in the `./` form.
            sed -i 's#uses: \$/#uses: ./#' "$dir"/.github/workflows/*.yml
            git -C "$dir" init -q
            (cd "$dir" && "$RUNNER_TEMP/actionlint-bin/actionlint")
          done

  # AK-2 for django: `standard --starter` writes the starter and its pipeline into an empty repo, then the
  # core steps of that pipeline run on it. Linux only, for the PostgreSQL service container (K3).
  # The commands, image and Python version are those of the module's ci.yml (tests/lib/stack-django.test.mjs).
  django-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # Throwaway password of the CI service container, not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Write the starter and its pipeline into an empty repo
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/django app"
          git init -q -b main "$dir"
          git -C "$dir" config user.name ci
          git -C "$dir" config user.email ci@localhost
          node plugins/buildorder/scripts/buildorder.mjs standard "$dir" --stack django --deploy container --starter --apply
          git -C "$dir" log --oneline --stat
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/django app
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        working-directory: ${{ runner.temp }}/django app
        run: |
          ruff check .
          ruff format --check .
      - name: Generate a throwaway SECRET_KEY
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: Test with coverage
        working-directory: ${{ runner.temp }}/django app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: pytest --cov --cov-report=term-missing
      - name: Build checks
        working-directory: ${{ runner.temp }}/django app
        env:
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Audit dependencies
        working-directory: ${{ runner.temp }}/django app
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt
      - name: Build the image
        working-directory: ${{ runner.temp }}/django app
        run: docker build --tag django-fixture .

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  ci-ok:
    if: always()
    needs: [test, validate, pre-commit, zizmor, django-fixture, gitleaks, codeql]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "At least one job did not succeed."
              exit 1
            fi
          done

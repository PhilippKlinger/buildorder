name: release

# Builds the release archive from the tagged commit, attests its provenance and attaches it to the release.
# Verify a downloaded archive with: gh attestation verify buildorder-<tag>.tar.gz --repo <owner>/buildorder
on:
  release:
    types: [published]

permissions: {}

jobs:
  attest:
    name: Attest release archive
    runs-on: ubuntu-latest
    permissions:
      # Upload the archive to the release.
      contents: write
      # Sign the attestation (OIDC).
      id-token: write
      # Store the attestation.
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Build release archive
        run: git archive --format=tar.gz --prefix=buildorder-"$TAG"/ -o buildorder-"$TAG".tar.gz "$TAG"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: buildorder-${{ github.event.release.tag_name }}.tar.gz
      - name: Upload archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" buildorder-"$TAG".tar.gz --clobber

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["manage.py", "config/wsgi.py", "**/tests.py", "**/test_*.py"]

[tool.coverage.report]
show_missing = true

# Python stack: lint (ruff), tests with coverage (pytest), the package build (wheel and sdist) and the
# dependency audit (pip-audit). Expects the starter's layout: pyproject.toml with a src/ layout and
# requirements-dev.txt in the repo root. Framework-agnostic: it fits a library as well as a service.
lint:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14.10"
    - name: Install dependencies
      run: python -m pip install --requirement requirements-dev.txt
    - name: Lint
      run: ruff check .
    - name: Check the formatting
      run: ruff format --check .

test:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14.10"
    - name: Install dependencies
      run: python -m pip install --requirement requirements-dev.txt --editable .
    - name: Test with coverage
      run: pytest --cov --cov-report=term-missing

build:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14.10"
    - name: Install dependencies
      run: python -m pip install --requirement requirements-dev.txt
    - name: Build the wheel and the sdist
      run: python -m build

audit:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14.10"
    - name: Install dependencies
      run: python -m pip install --requirement requirements-dev.txt
    - name: Audit the tools
      run: pip-audit --requirement requirements-dev.txt
    - name: Audit the project dependencies
      run: pip-audit .

# React stack (Vite, TypeScript): lint (ESLint, type check, Prettier), tests with coverage (Vitest), the production
# build (Vite) and the dependency audit (npm audit). Expects the starter's layout: package.json and
# package-lock.json in the repo root; Node is pinned the same way in .nvmrc, engines and the Dockerfile.
lint:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npx eslint .
    - name: Check the types
      run: npx tsc --noEmit
    - name: Check the formatting
      run: npx prettier --check .

test:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test with coverage
      run: npx vitest run --coverage

build:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npx vite build

audit:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Audit dependencies
      run: npm audit --audit-level=high
